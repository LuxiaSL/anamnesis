name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The gates that read only the repository. Every supported interpreter runs them,
  # because "supported" is a claim `requires-python` makes and this is what checks it.
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Full history, because G2 measures the change against the commit it starts from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest tests/

      # A pull request is measured against the tip of the branch it targets; a push
      # to main, against the commit main pointed at before the push.
      - name: G2 test retention
        env:
          G2_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p receipts
          python -m tools.check_test_retention --base "$G2_BASE" --head HEAD --json receipts/g2.json

      - name: G3 documentation timelessness
        run: |
          mkdir -p receipts
          python -m tools.check_timelessness --root anamnesis tools tests --json receipts/g3.json

      - name: G3 referent reachability
        run: |
          mkdir -p receipts
          python -m tools.check_referents --root anamnesis tools tests --json receipts/g3-referents.json

      - name: G4 import closure
        run: |
          mkdir -p receipts
          python -m tools.check_import_closure --package anamnesis \
            --roots anamnesis/scripts tests --json receipts/g4.json

      - name: Surface report (informational, never a gate)
        run: |
          mkdir -p receipts
          python -m tools.surface_report --root anamnesis --root tools --root tests \
            --baseline tools/surface_baseline_pl_4acedbf.json \
            --json receipts/surface.json

      # G1 reads banked signatures — hundreds of gigabytes of them — and asks whether
      # this tree computes the same features from the same inputs as the tree before
      # the change. A runner has no bank, and cross-machine floating-point reductions
      # differ anyway, so G1 is run on the machine that holds the data and its receipt
      # is attached to the pull request. CONTRIBUTING.md states the recipe.
      - name: G1 is a per-pull-request receipt, not a job here
        run: |
          echo "::notice title=G1::attach the g1_hash_manifest --compare receipt to the pull request; this runner has no banked signatures"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-receipts-py${{ matrix.python-version }}
          path: receipts/
          if-no-files-found: warn

  # A built wheel, installed somewhere the checkout cannot be imported from. Everything
  # above runs against the source tree, where `pythonpath = ["."]` makes imports work
  # whether or not the package declares them correctly. This job is the only place the
  # difference shows.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install it into a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl

      # Run from a directory that is not the checkout, so an import that only worked
      # because the source tree was the working directory fails here.
      - name: Smoke test the installation
        run: |
          mkdir -p /tmp/elsewhere
          cd /tmp/elsewhere
          /tmp/smoke/bin/python "${GITHUB_WORKSPACE}/tools/smoke_installed.py"
