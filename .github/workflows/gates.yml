name: gates

on:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest tests/

      - name: G3 documentation timelessness
        run: |
          mkdir -p receipts
          roots="tools tests"
          if [ -d anamnesis ]; then roots="anamnesis $roots"; fi
          python tools/check_timelessness.py --root $roots --json receipts/g3.json

      - name: G4 import closure
        run: |
          mkdir -p receipts
          if [ -d anamnesis ]; then
            roots="anamnesis/scripts"
            if [ -d tests ]; then roots="$roots tests"; fi
            python tools/check_import_closure.py --package anamnesis --roots $roots --json receipts/g4.json
          else
            echo "::notice title=G4::the package directory 'anamnesis' is absent, so the closure runs over 'tools'; the gate tooling lands before the package it gates"
            python tools/check_import_closure.py --package tools --roots tests --json receipts/g4.json
          fi

      # G1 and G2 read banked artifacts and a tree with the consolidations in it.
      # A runner has neither, so they are invoked per PR and their receipts attached.
      - name: G1 and G2 are invoked, not run here
        run: |
          echo "G1: python tools/g1_hash_manifest.py --signatures <dir> --out <manifest>, twice, then --compare"
          echo "G2: python tools/g2_loc_report.py --repo . --json g2.json"
          echo "Both need artifacts this runner does not have; attach their receipts to the pull request."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-receipts
          path: receipts/
          if-no-files-found: warn
