[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anamnesis"
version = "0.1.0"
description = "Computational state signatures: instrument for how a forward pass ran, not what it read."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "torch>=2.1",
    "transformers>=4.36",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The intrinsic-dimension estimators the gauntlet's geometry section calls are
# third-party. They are an extra because that section is one of eleven and says
# so when they are absent, rather than the package refusing to import.
geometry = [
    "dadapy>=0.3",
    "scikit-dimension>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["anamnesis", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
