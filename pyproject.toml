[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anamnesis"
version = "0.1.0"
description = "Computational state signatures: instrument for how a forward pass ran, not what it read."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["anamnesis", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
