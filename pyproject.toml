[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anamnesis"
version = "0.1.0"
description = "Computational state signatures: instrument for how a forward pass ran, not what it read."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luxia", email = "mail.luxia@gmail.com" }]
# The interpreters are the ones the gate workflow runs every check on, so the claim
# `requires-python` makes and the claim these rows make are tested by the same job.
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "torch>=2.1",
    # 4.54 is where ``Cache`` grew its ``layers`` list of per-layer objects holding
    # ``keys``/``values``, and where ``DynamicCache`` began accepting pre-built layer
    # data and a config. The fast lane's batched cache path is written against both
    # (anamnesis/extraction/fast/features.py:414), and on 4.53 it raises
    # AttributeError rather than degrading, so this floor is a requirement and not a
    # preference.
    "transformers>=4.54",
    # ``load_model`` places a checkpoint through the preset's device map
    # (anamnesis/extraction/model_loader.py), and transformers hands any device map to
    # accelerate, raising ValueError when it is absent. So every command that loads a
    # model needs it. Transformers 5 requires accelerate 1.1 and 4.54 requires 0.26,
    # so 1.1 satisfies every transformers this project accepts.
    "accelerate>=1.1",
    "tqdm>=4.66",
]

# An installed wheel carries no tree with it, so the link back to the source is the
# only way a reader of the metadata reaches the code the documentation points at.
[project.urls]
Homepage = "https://github.com/LuxiaSL/anamnesis"
Repository = "https://github.com/LuxiaSL/anamnesis"

[project.optional-dependencies]
dev = ["pytest>=8"]
# The intrinsic-dimension estimators the gauntlet's geometry section calls are
# third-party. They are an extra because that section is one of eleven and says
# so when they are absent, rather than the package refusing to import.
geometry = [
    "dadapy>=0.3",
    "scikit-dimension>=0.3",
    "ripser>=0.6",
]
# Sentence embeddings are the semantic section's yardstick for what a text says,
# which is the quantity every "orthogonal to content" claim is measured against.
# The model downloads on first use, so it is an extra for the same reason the
# judge is: it needs a network the rest of the instrument does not.
semantic = [
    "sentence-transformers>=2.2",
]
# Adapters are how a training run's checkpoints are loaded for a replay series:
# one base model plus a sequence of adapters, rather than a sequence of models.
# A corpus that never replays a fine-tune never needs it.
adapters = [
    "peft>=0.10",
]
# The judging layer is the one part of the instrument that talks to a model
# provider: it needs a network, a vendor account and a budget, where everything
# else here runs on a machine with none of the three. So the two client libraries
# are an extra, their imports are deferred to first use, and the test suite mocks
# the transport rather than installing them — which is also what guarantees no
# test can reach an API.
judge = [
    "anthropic>=0.40",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
# ``tools`` is the gate tooling: it checks this repository rather than forming part
# of the instrument, so it stays out of the wheel. Its own tests import it as a
# top-level module, which ``[tool.pytest.ini_options] pythonpath`` supplies from a
# checkout.
packages = ["anamnesis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
